[package]
name = "knot-lite"
version = "0.3.0"
edition = "2024"
description = "Database-free code intelligence for one repository: file-based vectors + language-server call graph (built on knot's parsers)"
authors = ["Raul Tovar <raultov@protonmail.com>"]
license = "MIT"
# Not published yet: the first crates.io release is the human's decision.
publish = false

[lints.rust]
# Enforces the no-unsafe policy stated in AGENTS.md. `deny` rather than
# `forbid`; `deny` still blocks new unsafe while allowing documented,
# audited exceptions via `#[expect(unsafe_code, reason = "...")]`.
unsafe_code = "deny"

[lints.clippy]
# Readability gates. Thresholds live in clippy.toml; these lints are
# allow-by-default (pedantic/nursery), so they are inert without this.
too_many_lines = "warn"
cognitive_complexity = "warn"

# Ban bare `#[allow]` in favour of `#[expect(..., reason = "...")]`, which
# warns once the suppression is no longer needed. This keeps the refactor
# backlog self-cleaning instead of accumulating stale opt-outs.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[[bin]]
name = "knot-lite"
path = "src/bin/knot-lite.rs"

[[bin]]
name = "knot-lite-mcp"
path = "src/bin/knot-lite-mcp.rs"

[dependencies]
# Parsers, file discovery, entity model, embedder, heuristic resolver (D3).
# crates.io release pinning the entity-identity fix (P2-D1). Default features
# are required: knot's src/ does not cfg-gate fastembed/ort behind `indexer`.
# The const index::manifest::KNOT_VERSION must match the locked version.
knot = "1.11.3"

# --- MCP server (stateless MCP 2026-07-28, stdio only) ---
rust-mcp-sdk = { version = "2.0", default-features = false, features = ["server", "macros", "stdio"] }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }

# --- Configuration & CLI ---
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"

# --- Filesystem traversal (same major as knot) ---
ignore = "0.4"

# --- Language servers (Phase 3) ---
# async-lsp's default features pull Unix-only crates (rustix, waitpid-any);
# the client needs none of them. lsp-types is used only through async_lsp.
async-lsp = { version = "0.2.4", default-features = false, features = ["omni-trait", "tokio", "tracing"] }
tower = { version = "0.5", features = ["util"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["compat"] }
url = "2"
# Process-tree RSS and termination; the "system" feature alone exposes
# System/Pid/ProcessRefreshKind without the disk/network/component probes.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# tsconfig `include` matching for the TypeScript pre-open set (already in the
# lockfile through `ignore`).
globset = "0.4"

# --- Index ---
base64 = "0.22"
sha2 = "0.11"          # same major as knot (no duplicate build)
uuid = { version = "1", features = ["v5"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# --- Output formatting (same version as knot) ---
comfy-table = "7.1"

# --- Errors & logging ---
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
