# Clippy thresholds for knot-lite.
#
# Inherited verbatim from knot on 2026-10-03 (knot v1.11.1). The measured
# curves quoted below are knot's, not knot-lite's: re-measure them on knot-lite's
# own code at the end of Phase 1 and only ever TIGHTEN (never loosen) a value.
#
# This file lives at the repository root on purpose: clippy searches parent
# directories, so every crate below (including docs/spikes/phase0) inherits it.
# Do not add per-crate copies.
#
# NOTE: a threshold here does NOT enable a lint, it only parametrises it.
# The lint's default level decides whether it fires:
#
#   too_many_arguments    complexity  warn   -> active out of the box
#   type_complexity       complexity  warn   -> active out of the box
#   excessive_nesting     complexity  warn   -> active once threshold > 0
#   too_many_lines        pedantic    allow  -> needs [lints.clippy]
#   cognitive_complexity  nursery     allow  -> needs [lints.clippy]
#
# The last two are enabled in Cargo.toml's [lints.clippy] section (every knot-lite crate copies knot's [lints.clippy] table verbatim).

# --- Active by default (complexity group) ---

# clippy::too_many_arguments (default: 7)
# Measured curve: 4 -> 45 | 5 -> 19 | 6 -> 6 | 7 -> 0
# knot-lite measured curve (Phase 1, 2026-10-04): 3 -> 12 | 4 -> 6 | 5 -> 0
# knot-lite measured curve (Phase 3, 2026-10-07, with the LSP layer and its tests): 4 -> 33 | 5 -> 0
# knot-lite measured curve (Phase 4, 2026-10-09; root crate / Phase 0 spike): 3 -> 72 / 47 | 4 -> 27 / 16 | 5 -> 0 / 0
# knot-lite measured curve (Phase 5, 2026-10-10; root / spike): 3 -> 102 / 47 | 4 -> 40 / 16 | 5 -> 0 / 0
# knot-lite measured curve (Phase 6, 2026-10-18; root / spike): 3 -> 107 / 47 | 4 -> 42 / 16 | 5 -> 0 / 0
# Unchanged: 5 stays the only value with zero violations.
# The repo's real maximum is 7, so the distribution is narrow. 4 is
# disproportionate, 6 barely helps. 5 is the useful point.
too-many-arguments-threshold = 5

# clippy::type_complexity (default: 250)
# Measured curve: 150 -> 10 | 200 -> 1 | 250 -> 0
# knot-lite measured curve (Phase 1, 2026-10-04): 100 -> 10 | 150 -> 6 | 200 -> 0
# knot-lite measured curve (Phase 3, 2026-10-07): 150 -> 17 | 200 -> 0 (unchanged)
# knot-lite measured curve (Phase 4, 2026-10-09; root / spike): 100 -> 68 / 23 | 150 -> 17 / 4 | 200 -> 0 / 0 (unchanged)
# knot-lite measured curve (Phase 5, 2026-10-10; root / spike): 100 -> 95 / 23 | 150 -> 27 / 4 | 200 -> 0 / 0 (unchanged)
# knot-lite measured curve (Phase 6, 2026-10-18; root / spike): 100 -> 104 / 23 | 150 -> 28 / 4 | 200 -> 0 / 0 (unchanged)
# 200 costs a single violation and already improves on the default.
# Later target: 150 — NOT yet applied: the knot-lite measurement at 150 is 6
# violations, and this file only ever tightens to a value with 0 violations.
type-complexity-threshold = 200

# clippy::excessive_nesting (default: 0, which disables the lint)
# The lint is warn-by-default; the zero threshold is what silences it,
# so setting a value here activates it without touching Cargo.toml.
# Measured curve: 3 -> 519 | 4 -> 220 | 5 -> 77 | 6 -> 26
# knot-lite measured curve (Phase 1, 2026-10-04): 4 -> 0 | 5 -> 0 | 6 -> 0
# knot-lite measured curve (Phase 3, 2026-10-07): 4 -> 21 | 5 -> 0 (unchanged)
# knot-lite measured curve (Phase 4, 2026-10-09; root / spike): 3 -> 113 / 37 | 4 -> 17 / 5 | 5 -> 0 / 0 (unchanged)
# knot-lite measured curve (Phase 5, 2026-10-10; root / spike): 3 -> 144 / 37 | 4 -> 23 / 5 | 5 -> 0 / 0 (unchanged)
# knot-lite measured curve (Phase 6, 2026-10-18; root / spike): 3 -> 190 / 37 | 4 -> 35 / 5 | 5 -> 0 / 0 (unchanged)
# 6 is the only manageable entry point for knot. Later target: 5 — applied for
# knot-lite (0 violations at 5; the code nests at most 4 deep).
excessive-nesting-threshold = 5

# --- Enabled via [lints.clippy] in Cargo.toml ---

# clippy::too_many_lines (pedantic, default: 100)
# Measured curve (functions exceeding T, production + tests, clippy 0.1.97):
#   50 -> 103 | 80 -> 17 | 100 -> 0
# knot-lite measured curve (Phase 1, 2026-10-04): 50 -> 1 | 80 -> 0 | 100 -> 0
# knot-lite measured curve (Phase 3, 2026-10-07): 80 -> 5 | 90 -> 5 | 95 -> 0 | 100 -> 0 (longest function: 94 lines).
# knot-lite measured curve (Phase 4, 2026-10-09; root / spike): 80 -> 3 / 6 | 90 -> 3 / 2 | 95 -> 0 / 2 | 100 -> 0 / 0 (unchanged).
# knot-lite measured curve (Phase 5, 2026-10-10; root / spike): 80 -> 3 / 6 | 90 -> 2 / 2 | 95 -> 0 / 2 | 100 -> 0 / 0 (unchanged;
# longest root function 94 lines; 95 still blocked by the frozen spike).
# knot-lite measured curve (Phase 6, 2026-10-18; root / spike): 80 -> 4 / 6 | 90 -> 3 / 2 | 95 -> 2 / 2 | 100 -> 0 / 0 (unchanged;
# longest root function 99 lines).
# Threshold matches clippy's own default. After the 2026-09 refactor pass
# no function exceeds 100 lines: the previous backlog (worst offender 421)
# was split into helpers instead of suppressed, and the blanket
# #[expect(too_many_lines)] opt-outs were all removed.
# Phase 3: kept at 100. 95 is clean for the library, but the Phase 0 spike crate (which shares this file) has
# functions of 96 and 98 lines and is frozen. Phase 3 split functions to stay under the limit (build_index,
# precompute_lang, the L2/L7 gates, ...); none was silenced.
too-many-lines-threshold = 100

# clippy::cognitive_complexity (nursery, default: 25)
# Measured curve (clippy 0.1.97, after 2026-09 refactor pass):
#   15 -> 28 | 20 -> 8 | 25 -> 6 | 30 -> 4 | 40 -> 2
# knot-lite measured curve (Phase 1, 2026-10-04): 10 -> 2 | 15 -> 0 | 20 -> 0
# knot-lite measured curve (Phase 3, 2026-10-07): 15 -> 1 | 20 -> 0 (unchanged; the single function above 15 scores 19, a stdio test session)
# knot-lite measured curve (Phase 4, 2026-10-09; root / spike): 10 -> 17 / 3 | 15 -> 2 / 0 | 20 -> 0 / 0 (unchanged).
# knot-lite measured curve (Phase 5, 2026-10-10; root / spike): 10 -> 19 / 3 | 15 -> 2 / 0 | 20 -> 0 / 0 (unchanged; max 18, a stdio test).
# knot-lite measured curve (Phase 6, 2026-10-18; root / spike): 10 -> 21 / 3 | 15 -> 2 / 0 | 20 -> 0 / 0 (unchanged; max 18, a stdio test).
#
# NOTE: tracing macros inflate the score by +7 per macro call because the
# `tracing/log` feature is enabled transitively (axum → tower/log → tracing/log) via
# rust-mcp-sdk and cannot be disabled due to additive feature unification.
#
# POLICY: An #[expect(clippy::cognitive_complexity)] attribute is only legitimate if:
#   measured_score - 7 * (number of tracing macros) <= 20
# Functions with net branching complexity > 20 must be refactored into helpers.
#
# Measure all scores with:
#   cargo clippy --all-targets --all-features --message-format=short -- --force-warn clippy::cognitive_complexity
cognitive-complexity-threshold = 20
