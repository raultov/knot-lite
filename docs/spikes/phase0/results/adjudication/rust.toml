# knot-rag gold adjudication (T7.3) — Rust / knot
#
# GOLD RULE (applied to every verdict): `tp` iff the reported container is the
# OWNER of a genuine reference site to the target symbol (owner =
# container_at(file, site_line); same symbol — not a homonym, not a string or
# comment, not another member/overload). `fp` when the container owns no such
# site: knot's parser/resolver attributes intents to enclosing or sibling
# entities (`mod x;` declarations, impl-block types, object literals) or
# resolves to a different member (`embed` vs `embed_query`, `VectorDb::connect`
# vs `ConnectExt`). Rationale: "who calls this symbol" means direct reference
# owners — also LSP's callHierarchy/references granularity (gates G1-G4).
#
# spot_check items are the seed-42 sample of auto-tp agreements (T7.3 rule 2),
# verified by reading the code — all 10 confirmed tp.
#
